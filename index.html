<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Static assets are served as external files for a simpler, durable GitHub Pages setup. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="no-referrer" />
  <title>AI Glossary</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="badge">AI Glossary</span>
      <h1>Speak fluent AI.</h1>
      <p class="subtitle">Quick, human-friendly explanations for the jargon shaping modern AI.</p>
      <div class="controls">
        <input id="searchInput" type="text" placeholder="Search concepts, aliases, or meanings" />
        <select id="categorySelect"></select>
        <button class="b1" id="randomBtn">Random</button>
        <button class="b2" id="clearBtn">Clear</button>
      </div>
    </section>

    <section class="layout">
      <aside class="left">
        <div class="meta">
          <span>Results</span>
          <span id="resultCount">Loading...</span>
        </div>
        <div class="list" id="resultsList"></div>
      </aside>

      <article class="right">
        <div id="detail"><div class="empty">Start typing to search the glossary.</div></div>
        <div class="hint">Keyboard: Arrow Up/Down to browse, Enter to return to search, Esc to clear.</div>
      </article>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>

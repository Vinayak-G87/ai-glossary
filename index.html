<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Glossary Widget</title>
  <style>
    :root {
      --bg0: #f4fbff;
      --bg1: #dff3ff;
      --panel: rgba(255, 255, 255, 0.74);
      --ink: #07233a;
      --muted: #406078;
      --line: rgba(7, 35, 58, 0.16);
      --cyan: #00a9e8;
      --teal: #00b894;
      --amber: #ff9b2f;
      --active: #e8f8ff;
      --shadow: 0 24px 70px rgba(0, 88, 131, 0.18);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI Variable", "Bahnschrift", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 10% 12%, rgba(0, 169, 232, 0.26), transparent 26%),
        radial-gradient(circle at 90% 18%, rgba(255, 155, 47, 0.22), transparent 30%),
        radial-gradient(circle at 72% 84%, rgba(0, 184, 148, 0.18), transparent 26%),
        linear-gradient(120deg, var(--bg0), var(--bg1));
      padding: 14px;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      background: linear-gradient(180deg, rgba(255,255,255,0.84), rgba(255,255,255,0.72));
      box-shadow: var(--shadow);
      animation: boot 700ms ease both;
    }

    .hero {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(115deg, rgba(0,169,232,0.13), rgba(255,155,47,0.10));
    }

    .badge {
      display: inline-block;
      border: 1px solid rgba(0,169,232,0.45);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #00688e;
      background: rgba(231, 247, 255, 0.78);
    }

    h1 {
      margin-top: 10px;
      font-family: "Bahnschrift", "Segoe UI Variable", sans-serif;
      font-size: clamp(1.3rem, 2.7vw, 2rem);
      letter-spacing: 0.02em;
      line-height: 1.18;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 180px 110px 110px;
      gap: 10px;
    }

    input, select, button {
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.86);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
      transition: 150ms ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: rgba(0,169,232,0.7);
      box-shadow: 0 0 0 4px rgba(0,169,232,0.14);
    }

    button { cursor: pointer; font-weight: 700; }
    .b1 { background: linear-gradient(135deg, rgba(0,169,232,.18), rgba(0,184,148,.2)); }
    .b2 { background: rgba(255,255,255,.74); }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 530px;
    }

    .left { border-right: 1px solid var(--line); background: rgba(255,255,255,.46); }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: .86rem;
    }

    .list { max-height: 484px; overflow: auto; }

    .item {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(7,35,58,.08);
      cursor: pointer;
      opacity: 0;
      transform: translateY(8px);
      animation: rise .36s ease forwards;
    }

    .item:hover { background: rgba(0,169,232,.08); }
    .item.active { background: var(--active); border-left: 3px solid var(--cyan); padding-left: 11px; }
    .item .t { font-weight: 700; }
    .item .c { color: var(--muted); font-size: .84rem; margin-top: 2px; }

    .right { padding: 18px; }
    .tag {
      display: inline-block;
      font-size: .73rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      border: 1px solid rgba(0,169,232,.5);
      border-radius: 999px;
      color: #005f84;
      background: rgba(230,247,255,.72);
      padding: 5px 10px;
    }

    .term {
      margin-top: 10px;
      font-family: "Bahnschrift", "Segoe UI Variable", sans-serif;
      font-size: clamp(1.35rem, 2.5vw, 1.98rem);
      line-height: 1.15;
    }

    .meaning { margin-top: 12px; line-height: 1.64; font-size: 1.02rem; }
    .example, .why { margin-top: 12px; line-height: 1.58; color: #1f4660; }
    .example {
      background: rgba(0, 169, 232, 0.08);
      border-left: 3px solid var(--cyan);
      border-radius: 10px;
      padding: 10px 12px;
      color: #09344f;
    }

    .related { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      border: 1px solid rgba(7,35,58,.24);
      border-radius: 999px;
      background: rgba(255,255,255,.76);
      padding: 6px 10px;
      font-size: .84rem;
      cursor: pointer;
    }

    .empty { color: var(--muted); text-align: center; padding: 42px 10px; line-height: 1.6; }

    .hint {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      color: var(--muted);
      font-size: .84rem;
    }

    @keyframes boot { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 880px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .layout { grid-template-columns: 1fr; }
      .left { border-right: 0; border-bottom: 1px solid var(--line); }
      .list { max-height: 280px; }
    }

    @media (max-width: 520px) {
      .controls { grid-template-columns: 1fr; }
      .hero, .right { padding: 14px; }
      body { padding: 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="badge">AI Glossary</span>
      <h1>AI Glossary Widget</h1>
      <p class="subtitle">Fast lookup for 183 AI concepts with aliases, examples, and related terms.</p>
      <div class="controls">
        <input id="searchInput" type="text" placeholder="Search concepts, aliases, or meanings" />
        <select id="categorySelect"></select>
        <button class="b1" id="randomBtn">Random</button>
        <button class="b2" id="clearBtn">Clear</button>
      </div>
    </section>

    <section class="layout">
      <aside class="left">
        <div class="meta">
          <span>Results</span>
          <span id="resultCount">Loading...</span>
        </div>
        <div class="list" id="resultsList"></div>
      </aside>

      <article class="right">
        <div id="detail"><div class="empty">Start typing to search the glossary.</div></div>
        <div class="hint">Keyboard: Arrow Up/Down to browse, Enter to return to search, Esc to clear.</div>
      </article>
    </section>
  </main>

  <script>
    const allEntries = [{"term": "Agent", "category": "Agents", "meaning": "Software that uses a model to choose and perform actions toward a goal.", "example": "A support agent reads a ticket, checks an order, and drafts a reply.", "related": ["Tool use", "Planning", "LLM"], "aliases": [], "whyItMatters": ""}, {"term": "Alignment", "category": "Security", "meaning": "Making an AI system behave in ways consistent with intended goals and human values.", "example": "Training a chatbot to be helpful while refusing unsafe requests.", "related": ["RLHF", "Guardrails"], "aliases": [], "whyItMatters": ""}, {"term": "Artificial General Intelligence (AGI)", "category": "Foundations", "meaning": "A hypothetical system able to learn and perform across most intellectual tasks at human level or beyond.", "example": "AGI is a research goal, not a capability current models are known to possess.", "related": ["Narrow AI"], "aliases": ["AGI"], "whyItMatters": "AGI is a research goal, not a capability current systems are known to possess."}, {"term": "Attention", "category": "Models", "meaning": "A mechanism that lets a model weigh which parts of its input matter most for each output.", "example": "While translating a pronoun, attention can emphasize the noun it refers to.", "related": ["Transformer", "Context window"], "aliases": [], "whyItMatters": ""}, {"term": "Autoencoder", "category": "Models", "meaning": "A network trained to compress data into a representation and reconstruct the original input.", "example": "An autoencoder can learn compact features from images.", "related": ["Embedding", "Latent space"], "aliases": [], "whyItMatters": ""}, {"term": "Backpropagation", "category": "Training", "meaning": "The algorithm used to calculate how each model parameter contributed to an error.", "example": "A network propagates loss backward before updating its weights.", "related": ["Gradient descent", "Loss function"], "aliases": [], "whyItMatters": ""}, {"term": "Benchmark", "category": "Evaluation", "meaning": "A standardized dataset and procedure used to compare model performance.", "example": "MMLU compares language models across many academic subjects.", "related": ["Evaluation", "Metric"], "aliases": [], "whyItMatters": ""}, {"term": "Chain of Thought", "category": "Prompting", "meaning": "Intermediate reasoning steps produced before a model gives its final answer.", "example": "A model works through a word problem step by step.", "related": ["Prompt", "Reasoning model"], "aliases": ["Chain-of-Thought Prompting", "CoT"], "whyItMatters": "Breaking complex problems into steps can improve reasoning performance."}, {"term": "Chunking", "category": "Retrieval", "meaning": "Splitting documents into smaller passages that can be indexed and retrieved.", "example": "A handbook is divided into 500-token sections for search.", "related": ["RAG", "Embedding"], "aliases": [], "whyItMatters": ""}, {"term": "Classification", "category": "Tasks", "meaning": "Assigning an input to one or more predefined labels.", "example": "Marking an email as spam or not spam.", "related": ["Supervised learning"], "aliases": [], "whyItMatters": ""}, {"term": "Context Window", "category": "Models", "meaning": "The maximum amount of input and generated text a model can consider at once.", "example": "A 32K-token model can process a medium-length report in one request.", "related": ["Token", "Attention"], "aliases": [], "whyItMatters": ""}, {"term": "Diffusion Model", "category": "Models", "meaning": "A generative model that learns to turn noise into structured data through repeated denoising.", "example": "An image generator gradually converts random noise into a photograph.", "related": ["Generative AI", "Latent space"], "aliases": [], "whyItMatters": ""}, {"term": "Distillation", "category": "Training", "meaning": "Training a smaller model to imitate a larger, more capable teacher model.", "example": "A compact model learns from outputs generated by a large model.", "related": ["Quantization", "Fine-tuning"], "aliases": [], "whyItMatters": ""}, {"term": "Embedding", "category": "Retrieval", "meaning": "A numeric vector representing the meaning or features of data.", "example": "Similar support questions have embeddings that are close together.", "related": ["Vector database", "Semantic search"], "aliases": [], "whyItMatters": ""}, {"term": "Epoch", "category": "Training", "meaning": "One complete pass through the training dataset.", "example": "Training for five epochs means the model sees every example five times.", "related": ["Batch", "Fine-tuning"], "aliases": [], "whyItMatters": ""}, {"term": "Few-shot Prompting", "category": "Prompting", "meaning": "Providing a model with a small number of examples in the prompt.", "example": "Two labeled reviews show the model how to classify a third.", "related": ["Zero-shot", "Prompt"], "aliases": [], "whyItMatters": ""}, {"term": "Fine-tuning", "category": "Training", "meaning": "Further training a pretrained model on narrower data for a specific behavior or domain.", "example": "A general language model is fine-tuned on legal documents.", "related": ["Pretraining", "LoRA"], "aliases": [], "whyItMatters": ""}, {"term": "Foundation Model", "category": "Foundations", "meaning": "A broadly trained model that can be adapted to many downstream tasks.", "example": "A language model is reused for summarization, search, and coding.", "related": ["Pretraining", "Fine-tuning"], "aliases": [], "whyItMatters": ""}, {"term": "Generative AI", "category": "Foundations", "meaning": "AI that creates new content such as text, images, audio, video, or code.", "example": "A model writes a product description from bullet points.", "related": ["LLM", "Diffusion model"], "aliases": ["GenAI"], "whyItMatters": "It shifts AI from prediction toward creating new content."}, {"term": "Gradient Descent", "category": "Training", "meaning": "An optimization method that adjusts parameters in the direction that reduces error.", "example": "Each training step nudges model weights toward a lower loss.", "related": ["Backpropagation", "Learning rate"], "aliases": [], "whyItMatters": ""}, {"term": "Guardrails", "category": "Security", "meaning": "Rules and technical controls that constrain model inputs, outputs, or actions.", "example": "A filter blocks personal data from being included in responses.", "related": ["Alignment", "Grounding"], "aliases": [], "whyItMatters": ""}, {"term": "Hallucination", "category": "Reliability", "meaning": "A fluent but unsupported or incorrect model output.", "example": "A chatbot invents a journal article that does not exist.", "related": ["Grounding", "RAG"], "aliases": [], "whyItMatters": ""}, {"term": "Inference", "category": "Operations", "meaning": "Running a trained model to produce a prediction or output.", "example": "Generating a summary from a report is an inference request.", "related": ["Latency", "Training"], "aliases": [], "whyItMatters": ""}, {"term": "Large Language Model (LLM)", "category": "Models", "meaning": "A model trained on large text collections to understand and generate language.", "example": "An LLM can summarize documents or answer questions in natural language.", "related": ["Transformer", "Token"], "aliases": ["LLM"], "whyItMatters": "LLMs are the core model behind most modern chat and coding assistants."}, {"term": "Latency", "category": "Operations", "meaning": "The time between sending a request and receiving a response.", "example": "Streaming makes the first words appear before the full answer is ready.", "related": ["Inference", "Throughput"], "aliases": [], "whyItMatters": ""}, {"term": "Learning Rate", "category": "Training", "meaning": "A setting controlling the size of each parameter update during training.", "example": "A rate that is too high can make training unstable.", "related": ["Gradient descent", "Hyperparameter"], "aliases": [], "whyItMatters": ""}, {"term": "LoRA", "category": "Training", "meaning": "Low-Rank Adaptation, an efficient way to fine-tune a model by training small added matrices.", "example": "A team customizes an LLM without updating all of its original weights.", "related": ["Fine-tuning", "PEFT"], "aliases": ["Low-Rank Adaptation"], "whyItMatters": "LoRA makes model customization cheaper and more practical."}, {"term": "Loss Function", "category": "Training", "meaning": "A formula measuring how far a model's prediction is from the desired result.", "example": "Cross-entropy loss penalizes incorrect class probabilities.", "related": ["Backpropagation", "Gradient descent"], "aliases": [], "whyItMatters": ""}, {"term": "Machine Learning", "category": "Foundations", "meaning": "Methods that learn patterns from data instead of relying only on explicit rules.", "example": "A fraud detector learns signals from past transactions.", "related": ["Deep learning", "Supervised learning"], "aliases": ["ML"], "whyItMatters": "Most modern AI systems are built using machine-learning techniques."}, {"term": "Model", "category": "Foundations", "meaning": "A learned mathematical system that maps inputs to predictions or generated outputs.", "example": "A vision model maps image pixels to object labels.", "related": ["Training", "Inference"], "aliases": [], "whyItMatters": ""}, {"term": "Multimodal", "category": "Models", "meaning": "Able to process or generate more than one kind of data, such as text, images, or audio.", "example": "A model answers questions about an uploaded chart.", "related": ["Vision-language model"], "aliases": [], "whyItMatters": "Multimodal models can work across richer real-world inputs than text alone."}, {"term": "Neural Network", "category": "Models", "meaning": "A layered computational model whose connected parameters learn patterns from data.", "example": "A network learns to identify handwritten digits.", "related": ["Deep learning", "Parameter"], "aliases": [], "whyItMatters": ""}, {"term": "Overfitting", "category": "Training", "meaning": "Learning the training examples too specifically, causing poor performance on new data.", "example": "A classifier scores perfectly in training but fails on unseen samples.", "related": ["Regularization", "Validation set"], "aliases": [], "whyItMatters": ""}, {"term": "Parameter", "category": "Models", "meaning": "A learned numeric value inside a model that shapes its behavior.", "example": "Training changes billions of weights in a large language model.", "related": ["Training", "Hyperparameter"], "aliases": ["Weight"], "whyItMatters": "Parameter count is one rough indicator of a model's size and capacity."}, {"term": "Prompt", "category": "Prompting", "meaning": "The instructions and context supplied to a generative model.", "example": "A prompt asks for a concise summary aimed at executives.", "related": ["System prompt", "Few-shot prompting"], "aliases": [], "whyItMatters": ""}, {"term": "Prompt Injection", "category": "Security", "meaning": "An input designed to make a model ignore instructions or misuse connected tools and data.", "example": "A malicious document tells a reading agent to reveal private context.", "related": ["Guardrails", "System prompt"], "aliases": [], "whyItMatters": ""}, {"term": "Quantization", "category": "Operations", "meaning": "Representing model numbers with fewer bits to reduce memory use and often speed inference.", "example": "An 8-bit model runs on hardware that cannot fit the full-precision version.", "related": ["Distillation", "Inference"], "aliases": [], "whyItMatters": ""}, {"term": "RAG", "category": "Retrieval", "meaning": "Retrieval-Augmented Generation: fetching relevant sources and giving them to a model before it answers.", "example": "A chatbot retrieves policy passages before answering an employee.", "related": ["Embedding", "Vector database", "Grounding"], "aliases": ["Retrieval-Augmented Generation"], "whyItMatters": "RAG uses fresh or private knowledge without retraining the base model."}, {"term": "Reinforcement Learning", "category": "Training", "meaning": "Learning actions through rewards or penalties received from an environment.", "example": "A game-playing system improves by receiving rewards for winning.", "related": ["RLHF", "Agent"], "aliases": ["RL"], "whyItMatters": "Rewards are useful when behavior must be shaped by outcomes rather than labels alone."}, {"term": "RLHF", "category": "Training", "meaning": "Reinforcement Learning from Human Feedback, using human preferences to improve model behavior.", "example": "Reviewers rank responses and the rankings guide further training.", "related": ["Alignment", "Reinforcement learning"], "aliases": ["Reinforcement Learning from Human Feedback"], "whyItMatters": "RLHF uses human preferences to make assistant behavior more useful."}, {"term": "Semantic Search", "category": "Retrieval", "meaning": "Search based on meaning rather than only exact keyword matches.", "example": "A search for 'reset login' also finds a passage about changing a password.", "related": ["Embedding", "Vector database"], "aliases": [], "whyItMatters": ""}, {"term": "Structured Output", "category": "Prompting", "meaning": "Model output constrained to a defined format such as a JSON schema.", "example": "An extraction workflow returns validated fields instead of prose.", "related": ["Tool use", "Prompt"], "aliases": [], "whyItMatters": ""}, {"term": "System Prompt", "category": "Prompting", "meaning": "High-priority instructions that define a model's role, boundaries, and behavior.", "example": "A system prompt tells an assistant to answer using company policy only.", "related": ["Prompt", "Prompt injection"], "aliases": [], "whyItMatters": ""}, {"term": "Temperature", "category": "Prompting", "meaning": "A setting that controls randomness in generated output; lower values are usually more predictable.", "example": "A low temperature is useful for consistent data extraction.", "related": ["Sampling", "Token"], "aliases": [], "whyItMatters": ""}, {"term": "Token", "category": "Models", "meaning": "A small unit of text processed by a language model, often a word or part of a word.", "example": "The word 'unhelpful' may be split into multiple tokens.", "related": ["Context window", "LLM"], "aliases": [], "whyItMatters": "Model limits and pricing are often measured in tokens rather than words."}, {"term": "Tool Use", "category": "Agents", "meaning": "A model's ability to call external functions, APIs, or applications through defined interfaces.", "example": "An assistant calls a weather API before answering a forecast question.", "related": ["Agent", "Structured output"], "aliases": [], "whyItMatters": ""}, {"term": "Transformer", "category": "Models", "meaning": "A neural network architecture built around attention and used by most modern language models.", "example": "A transformer processes relationships among all tokens in a sentence.", "related": ["Attention", "LLM"], "aliases": [], "whyItMatters": ""}, {"term": "Vector Database", "category": "Retrieval", "meaning": "A database optimized to store embeddings and find nearby vectors.", "example": "A RAG system uses one to retrieve semantically similar passages.", "related": ["Embedding", "RAG"], "aliases": [], "whyItMatters": ""}, {"term": "Zero-shot", "category": "Prompting", "meaning": "Asking a model to perform a task without providing examples in the prompt.", "example": "A model classifies sentiment from instructions alone.", "related": ["Few-shot prompting", "Prompt"], "aliases": ["Zero-shot Prompting"], "whyItMatters": "It tests whether a model understands a task from instructions alone."}, {"term": "Artificial Intelligence", "category": "Foundations", "meaning": "Software that performs tasks that normally require human intelligence.", "example": "A system identifies objects in photos or writes a summary.", "related": ["Machine Learning", "Generative AI"], "aliases": ["AI"], "whyItMatters": "It is the broad umbrella containing modern machine learning and generative AI."}, {"term": "Deep Learning", "category": "Foundations", "meaning": "Machine learning based on large multi-layer neural networks.", "example": "A deep network learns to recognize speech from thousands of hours of audio.", "related": ["Neural Network", "Transformer"], "aliases": [], "whyItMatters": "Deep learning powers most modern language, vision, and speech models."}, {"term": "Hyperparameter", "category": "Models", "meaning": "A setting chosen by developers rather than learned directly from data.", "example": "Learning rate and batch size are hyperparameters.", "related": ["Learning Rate", "Batch"], "aliases": [], "whyItMatters": "Hyperparameters strongly affect training quality, speed, and cost."}, {"term": "Latent Space", "category": "Models", "meaning": "A compressed internal representation where useful features are encoded numerically.", "example": "An image model moves through latent space to vary pose or style.", "related": ["Embedding", "Diffusion Model"], "aliases": [], "whyItMatters": "Latent representations let models manipulate complex concepts efficiently."}, {"term": "Vision-Language Model", "category": "Models", "meaning": "A model designed to understand both images and language.", "example": "It inspects a screenshot and identifies the visible button.", "related": ["Multimodal", "Transformer"], "aliases": ["VLM"], "whyItMatters": "VLMs enable visual assistants, document understanding, and image reasoning."}, {"term": "Mixture of Experts", "category": "Models", "meaning": "A model with specialized subnetworks where only some activate for each input.", "example": "A request routes through experts strongest at code or mathematics.", "related": ["Transformer", "Parameter"], "aliases": ["MoE"], "whyItMatters": "MoE increases capacity without using every parameter for every request."}, {"term": "Small Language Model", "category": "Models", "meaning": "A compact language model optimized for lower cost or local use.", "example": "A lapto     let categories = ["All"];
    let currentResults = [];
    let selectedIndex = -1;

    function scoreMatch(entry, words, normalized) {
      const term = (entry.term || "").toLowerCase();
      const aliases = (entry.aliases || []).map(a => String(a).toLowerCase());
      if (!normalized) return 1;

      let score = 0;
      if (term === normalized) score += 50;
      else if (term.startsWith(normalized.split(/\s+/)[0])) score += 12;

      for (const w of words) {
        if (aliases.includes(w)) score += 16;
        else if (aliases.some(a => a.startsWith(w))) score += 10;
        else if (term.includes(w)) score += 8;
        else score += 1;
      }
      return score;
    }

    function search(query = "", category = "All") {
      const normalized = query.trim().toLowerCase();
      const words = normalized.split(/\s+/).filter(Boolean);

      const results = allEntries.filter(entry => {
        if (category !== "All" && entry.category !== category) return false;
        const searchable = [
          entry.term,
          entry.category,
          entry.meaning,
          entry.example,
          entry.whyItMatters,
          ...(entry.aliases || []),
          ...(entry.related || [])
        ].join(" ").toLowerCase();

        return words.every(w => searchable.includes(w));
      });

      results.sort((a, b) => {
        const diff = scoreMatch(b, words, normalized) - scoreMatch(a, words, normalized);
        return diff !== 0 ? diff : (a.term || "").localeCompare(b.term || "");
      });

      return results;
    }

    function clearExample(entry) {
      const rawExample = (entry.example || "").trim();
      const rawMeaning = (entry.meaning || "").trim();

      if (!rawExample) {
        return "In practice, this concept helps solve a real task in an AI system.";
      }

      const example = /[.!?]$/.test(rawExample) ? rawExample : `${rawExample}.`;
      if (example.length >= 70 || !rawMeaning) return example;

      const firstSentence = rawMeaning.split(".")[0].trim();
      if (!firstSentence) return example;

      const lowered = firstSentence.charAt(0).toLowerCase() + firstSentence.slice(1);
      return `${example} In plain terms, ${lowered}.`;
    }

    function renderEntry(entry) {
      const safeRelated = (entry.related || []).map(r => String(r).replaceAll("'", "\\\'").replaceAll('"', '&quot;'));
      const related = safeRelated.map(r => `<button class="pill" onclick="searchFor('${r}')">${r}</button>`).join("");

      return `
        <div class="tag">${entry.category || "General"}</div>
        <h2 class="term">${entry.term || "Untitled"}</h2>
        <p class="meaning">${entry.meaning || "No description available."}</p>
        <p class="example"><strong>Clear example:</strong> ${clearExample(entry)}</p>
        ${entry.whyItMatters ? `<p class="why"><strong>Why it matters:</strong> ${entry.whyItMatters}</p>` : ""}
        ${related ? `<div class="related">${related}</div>` : ""}
      `;
    }

    function selectResult(index) {
      if (index < 0 || index >= currentResults.length) return;
      selectedIndex = index;

      document.querySelectorAll('.item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      document.getElementById('detail').innerHTML = renderEntry(currentResults[index]);
      const active = document.querySelector('.item.active');
      if (active) active.scrollIntoView({ block: 'nearest' });
    }

    function updateResults() {
      const q = document.getElementById('searchInput').value;
      const c = document.getElementById('categorySelect').value;

      currentResults = search(q, c);
      selectedIndex = -1;
      document.getElementById('resultCount').textContent = `${currentResults.length} terms`;

      const list = document.getElementById('resultsList');
      if (!currentResults.length) {
        list.innerHTML = '<div class="empty">No matches found. Try a broader query.</div>';
        document.getElementById('detail').innerHTML = '<div class="empty">No matching concept for this input.</div>';
        return;
      }

      list.innerHTML = currentResults.map((e, i) => `
        <div class="item" style="animation-delay:${Math.min(i * 24, 320)}ms" data-index="${i}" onclick="selectResult(${i})">
          <div class="t">${e.term}</div>
          <div class="c">${e.category}</div>
        </div>
      `).join('');

      selectResult(0);
    }

    function populateCategories() {
      categories = ["All", ...new Set(allEntries.map(e => e.category).filter(Boolean))].sort((a, b) =>
        a === "All" ? -1 : b === "All" ? 1 : a.localeCompare(b)
      );

      document.getElementById('categorySelect').innerHTML = categories
        .map(c => `<option value="${c}">${c}</option>`)
        .join('');
    }

    function searchFor(term) {
      document.getElementById('searchInput').value = term;
      document.getElementById('categorySelect').value = 'All';
      updateResults();
    }

    function bindEvents() {
      document.getElementById('searchInput').addEventListener('input', updateResults);
      document.getElementById('categorySelect').addEventListener('change', updateResults);

      document.getElementById('clearBtn').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('categorySelect').value = 'All';
        updateResults();
        document.getElementById('searchInput').focus();
      });

      document.getElementById('randomBtn').addEventListener('click', () => {
        const random = allEntries[Math.floor(Math.random() * allEntries.length)];
        document.getElementById('searchInput').value = random.term;
        document.getElementById('categorySelect').value = 'All';
        updateResults();
      });

      document.getElementById('searchInput').addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectResult(Math.min(selectedIndex + 1, currentResults.length - 1));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectResult(Math.max(selectedIndex - 1, 0));
        } else if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('searchInput').select();
        } else if (e.key === 'Escape') {
          document.getElementById('searchInput').value = '';
          updateResults();
        }
      });
    }

    function init() {
      populateCategories();
      bindEvents();
      updateResults();
      document.getElementById('searchInput').focus();
    }

    init();
  </script>
